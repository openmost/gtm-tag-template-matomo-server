scenarios:
- name: replays a Matomo hit losslessly with plugin parameters
  code: |-
    const r = run(replayEvent({ fa_id: 'f1', fa_fields: '[{"fn":"email"}]', send_image: '0' }));
    assertThat(r.length).isEqualTo(1);
    assertThat(r[0].url).isEqualTo('https://matomo.example.com/matomo.php');
    assertThat(r[0].options.method).isEqualTo('POST');
    assertThat(r[0].params.fa_id).isEqualTo('f1');
    assertThat(r[0].params.fa_fields).isEqualTo('[{"fn":"email"}]');
    assertThat(r[0].params.cip).isEqualTo('203.0.113.9');
    assertThat(r[0].params.ua).isEqualTo('UA-X');
    assertThat(r[0].params.lang).isEqualTo('fr-FR');
    assertThat(r[0].params.token_auth).isEqualTo('tok123');
    assertThat(r[0].body.indexOf('send_image=0')).isEqualTo(r[0].body.lastIndexOf('send_image=0'));
    assertApi('gtmOnSuccess').wasCalled();
- name: token auth never appears in the URL
  code: |-
    const r = run(replayEvent({}));
    assertThat(r[0].url.indexOf('token')).isEqualTo(-1);
- name: forwards request context headers
  code: |-
    const ev = replayEvent({});
    ev['x-matomo-request'] = { referer: 'https://www.example.com/', dnt: '1', ignore_cookie: '*' };
    const r = run(ev);
    assertThat(r[0].options.headers['referer']).isEqualTo('https://www.example.com/');
    assertThat(r[0].options.headers['dnt']).isEqualTo('1');
    assertThat(r[0].options.headers['Cookie']).isEqualTo('matomo_ignore=*');
    assertThat(r[0].options.headers['User-Agent']).isEqualTo('UA-X');
    assertThat(r[0].options.headers['Content-Type']).isEqualTo('application/x-www-form-urlencoded; charset=UTF-8');
- name: site ID field overrides the hit site ID
  code: |-
    const r = run(replayEvent({}), { idSite: '7' });
    assertThat(r[0].params.idsite).isEqualTo('7');
- name: removes and overrides parameters
  code: |-
    const r = run(replayEvent({ fa_fields: 'x' }), { removeParams: 'fa_fields, _id', overrides: [{ key: 'dimension1', value: 'server' }] });
    assertThat(r[0].params.fa_fields).isUndefined();
    assertThat(r[0].params._id).isUndefined();
    assertThat(r[0].params.dimension1).isEqualTo('server');
- name: array parameters are sent as repeated keys and UTF8 is encoded
  code: |-
    const r = run(replayEvent({ 'fa_fp[]': ['a', 'b'], action_name: 'Café crème' }));
    assertThat(r[0].body).contains('fa_fp%5B%5D=a&fa_fp%5B%5D=b');
    assertThat(r[0].body).contains('action_name=Caf%C3%A9%20cr%C3%A8me');
- name: consent variable denied strips visitor identifiers
  code: |-
    const r = run(replayEvent({ cid: '0123456789abcdef', _idn: '0', uid: 'u1' }), { consentSource: 'variable', consentValue: 'denied' });
    assertThat(r[0].params._id).isUndefined();
    assertThat(r[0].params.cid).isUndefined();
    assertThat(r[0].params._idn).isUndefined();
    assertThat(r[0].params.uid).isUndefined();
- name: consent denied keeps uid when the option is off
  code: |-
    const r = run(replayEvent({ uid: 'u1' }), { consentSource: 'variable', consentValue: 'false', stripUidOnDenied: false });
    assertThat(r[0].params.uid).isEqualTo('u1');
    assertThat(r[0].params._id).isUndefined();
- name: automatic consent keeps identifiers of Matomo client hits
  code: |-
    const r = run(replayEvent({ uid: 'u1' }));
    assertThat(r[0].params._id).isEqualTo('0123456789abcdef');
    assertThat(r[0].params.uid).isEqualTo('u1');
- name: Matomo error status calls gtmOnFailure
  code: |-
    run(replayEvent({}), {}, 400);
    assertApi('gtmOnFailure').wasCalled();
    assertApi('gtmOnSuccess').wasNotCalled();
- name: GA4 event without site ID fails without sending
  code: |-
    const r = run({ event_name: 'page_view', client_id: '1.2' });
    assertThat(r.length).isEqualTo(0);
    assertApi('gtmOnFailure').wasCalled();
- name: GA4 page view maps to a Matomo pageview with hashed visitor id
  code: |-
    const r = run(ga4Event({ event_name: 'page_view', user_id: 'u42', 'x-ga-gcs': 'G111' }), { idSite: '3' });
    const visitorId = sha256Sync('123.456', { outputEncoding: 'hex' }).substring(0, 16);
    assertThat(r.length).isEqualTo(1);
    const p = r[0].params;
    assertThat(p.idsite).isEqualTo('3');
    assertThat(p.rec).isEqualTo('1');
    assertThat(p.url).isEqualTo('https://www.example.com/p');
    assertThat(p.action_name).isEqualTo('Page');
    assertThat(p.urlref).isEqualTo('https://google.com/');
    assertThat(p.cip).isEqualTo('203.0.113.9');
    assertThat(p.ua).isEqualTo('UA-X');
    assertThat(p.lang).isEqualTo('fr-fr');
    assertThat(p.res).isEqualTo('1920x1080');
    assertThat(p.uid).isEqualTo('u42');
    assertThat(p._id).isEqualTo(visitorId);
    assertThat(p._id.length).isEqualTo(16);
    assertThat(p.cid).isEqualTo(visitorId);
    assertThat(p.pv_id).isEqualTo(sha256Sync('123.456|789|https://www.example.com/p', { outputEncoding: 'hex' }).substring(0, 6));
    assertThat(p.e_c).isUndefined();
- name: excluded GA4 events are not sent
  code: |-
    const r = run(ga4Event({ event_name: 'session_start' }), { idSite: '1' });
    assertThat(r.length).isEqualTo(0);
    assertApi('gtmOnSuccess').wasCalled();
- name: GA4 site search maps to Matomo search with configured keys
  code: |-
    const r = run(ga4Event({ event_name: 'view_search_results', search_term: 'shoes', search_type: 'products', results: 12 }), { idSite: '1', searchCategoryKey: 'search_type', searchCountKey: 'results' });
    assertThat(r[0].params.search).isEqualTo('shoes');
    assertThat(r[0].params.search_cat).isEqualTo('products');
    assertThat(r[0].params.search_count).isEqualTo('12');
    assertThat(r[0].params.action_name).isUndefined();
- name: GA4 file download and outbound click map to download and outlink
  code: |-
    const d = run(ga4Event({ event_name: 'file_download', link_url: 'https://www.example.com/f.pdf' }), { idSite: '1' });
    assertThat(d[0].params.download).isEqualTo('https://www.example.com/f.pdf');
    assertThat(d[0].params.e_c).isUndefined();
    const l = run(ga4Event({ event_name: 'click', link_url: 'https://other.com/', outbound: true }), { idSite: '1' });
    assertThat(l[0].params.link).isEqualTo('https://other.com/');
- name: non outbound click becomes an Other event
  code: |-
    const r = run(ga4Event({ event_name: 'click', link_url: 'https://www.example.com/a' }), { idSite: '1' });
    assertThat(r[0].params.e_c).isEqualTo('Other');
    assertThat(r[0].params.e_a).isEqualTo('Click');
- name: automatic categories and labelized actions
  code: |-
    const cases = [
      ['add_to_cart', 'Ecommerce', 'Add to cart'],
      ['begin_checkout', 'Ecommerce', 'Begin checkout'],
      ['generate_lead', 'Lead', 'Generate lead'],
      ['close_convert_lead', 'Lead', 'Close convert lead'],
      ['login', 'Auth', 'Login'],
      ['logout', 'Auth', 'Logout'],
      ['sign_up', 'Auth', 'Sign up'],
      ['share', 'Content', 'Share'],
      ['join_group', 'Content', 'Join group'],
      ['tutorial_begin', 'Onboarding', 'Tutorial begin'],
      ['level_up', 'Game', 'Level up'],
      ['spend_virtual_currency', 'Game', 'Spend virtual currency'],
      ['ad_impression', 'Advertising', 'Ad impression'],
      ['video_start', 'Video', 'Video start'],
      ['form_submit', 'Form', 'Form submit'],
      ['scroll', 'Engagement', 'Scroll'],
      ['my_custom_event', 'Other', 'My custom event']
    ];
    cases.forEach(function (c) {
      const r = run(ga4Event({ event_name: c[0] }), { idSite: '1' });
      assertThat(r[0].params.e_c, c[0]).isEqualTo(c[1]);
      assertThat(r[0].params.e_a, c[0]).isEqualTo(c[2]);
    });
- name: event category and event action parameters override automatic values
  code: |-
    const r = run(ga4Event({ event_name: 'add_to_cart', event_category: 'Shop', event_action: 'Basket add' }), { idSite: '1' });
    assertThat(r[0].params.e_c).isEqualTo('Shop');
    assertThat(r[0].params.e_a).isEqualTo('Basket add');
- name: tag fields override event parameters
  code: |-
    const r = run(ga4Event({ event_name: 'login', event_category: 'Shop' }), { idSite: '1', eventCategory: 'Forced', eventAction: 'Act', eventName: 'Nm', eventValue: '7' });
    assertThat(r[0].params.e_c).isEqualTo('Forced');
    assertThat(r[0].params.e_a).isEqualTo('Act');
    assertThat(r[0].params.e_n).isEqualTo('Nm');
    assertThat(r[0].params.e_v).isEqualTo('7');
- name: automatic event names
  code: |-
    const cases = [
      [{ event_name: 'add_to_cart', items: [{ item_name: 'Shoe' }] }, 'Shoe'],
      [{ event_name: 'view_promotion', promotion_name: 'Summer' }, 'Summer'],
      [{ event_name: 'select_promotion', items: [{ promotion_name: 'Winter' }] }, 'Winter'],
      [{ event_name: 'view_item_list', item_list_name: 'Related' }, 'Related'],
      [{ event_name: 'refund', transaction_id: 'T9' }, 'T9'],
      [{ event_name: 'generate_lead', lead_source: 'Newsletter' }, 'Newsletter'],
      [{ event_name: 'generate_lead', lead_source: 'Newsletter', event_label: 'Forced label' }, 'Forced label']
    ];
    cases.forEach(function (c) {
      const r = run(ga4Event(c[0]), { idSite: '1' });
      assertThat(r[0].params.e_n, c[0].event_name).isEqualTo(c[1]);
    });
    const login = run(ga4Event({ event_name: 'login' }), { idSite: '1' });
    assertThat(login[0].params.e_n).isUndefined();
- name: numeric value becomes event value and non numeric is dropped
  code: |-
    const ok = run(ga4Event({ event_name: 'generate_lead', value: '12.5' }), { idSite: '1' });
    assertThat(ok[0].params.e_v).isEqualTo('12.5');
    const ko = run(ga4Event({ event_name: 'generate_lead', value: 'abc' }), { idSite: '1' });
    assertThat(ko[0].params.e_v).isUndefined();
- name: custom dimensions are mapped from event data
  code: |-
    const r = run(ga4Event({ event_name: 'page_view', page_type: 'product' }), { idSite: '1', dimensions: [{ key: 'page_type', dimensionId: '2' }, { key: 'missing', dimensionId: '3' }] });
    assertThat(r[0].params.dimension2).isEqualTo('product');
    assertThat(r[0].params.dimension3).isUndefined();
- name: GA4 consent denied strips identifiers while granted or absent keeps them
  code: |-
    const denied = run(ga4Event({ event_name: 'page_view', user_id: 'u1', 'x-ga-gcs': 'G100' }), { idSite: '1' });
    assertThat(denied[0].params._id).isUndefined();
    assertThat(denied[0].params.cid).isUndefined();
    assertThat(denied[0].params.uid).isUndefined();
    const granted = run(ga4Event({ event_name: 'page_view', 'x-ga-gcs': 'G101' }), { idSite: '1' });
    assertThat(granted[0].params._id).isDefined();
    const absent = run(ga4Event({ event_name: 'page_view' }), { idSite: '1' });
    assertThat(absent[0].params._id).isDefined();
- name: purchase sends an Ecommerce event then the Matomo order
  code: |-
    const r = run(ga4Event({
      event_name: 'purchase', transaction_id: 'T1', value: 129.9, tax: 20, shipping: 10,
      items: [{ item_id: 'SKU1', item_name: 'Shoe', item_category: 'Shoes', item_category2: 'Men', price: 59.95, quantity: 2, discount: 5 }]
    }), { idSite: '1' });
    assertThat(r.length).isEqualTo(2);
    assertThat(r[0].params.e_c).isEqualTo('Ecommerce');
    assertThat(r[0].params.e_a).isEqualTo('Purchase');
    assertThat(r[0].params.e_n).isEqualTo('T1');
    const o = r[1].params;
    assertThat(o.idgoal).isEqualTo('0');
    assertThat(o.ec_id).isEqualTo('T1');
    assertThat(o.revenue).isEqualTo('159.9');
    assertThat(o.ec_st).isEqualTo('129.9');
    assertThat(o.ec_tx).isEqualTo('20');
    assertThat(o.ec_sh).isEqualTo('10');
    assertThat(o.ec_dt).isEqualTo('10');
    assertThat(o.ec_items).isEqualTo('[["SKU1","Shoe",["Shoes","Men"],59.95,2]]');
    assertThat(o.e_c).isUndefined();
- name: hits of one event are sent one after another
  code: |-
    const callbacks = [];
    mock('getAllEventData', ga4Event({ event_name: 'purchase', transaction_id: 'T1', value: 10 }));
    mock('sendHttpRequest', function (url, cb) { callbacks.push(cb); });
    runCode(withData({ idSite: '1' }));
    assertThat(callbacks.length).isEqualTo(1);
    callbacks[0](204, {}, '');
    assertThat(callbacks.length).isEqualTo(2);
    assertApi('gtmOnSuccess').wasNotCalled();
    callbacks[1](204, {}, '');
    assertApi('gtmOnSuccess').wasCalled();
- name: purchase without items sends an empty item list
  code: |-
    const r = run(ga4Event({ event_name: 'purchase', transaction_id: 'T2', value: 10 }), { idSite: '1' });
    assertThat(r.length).isEqualTo(2);
    assertThat(r[1].params.ec_items).isEqualTo('[]');
    assertThat(r[1].params.ec_dt).isUndefined();
    assertApi('gtmOnSuccess').wasCalled();
- name: cart events send only the event without full cart variable
  code: |-
    const r = run(ga4Event({ event_name: 'add_to_cart', items: [{ item_id: 'SKU1', item_name: 'Shoe', price: 10, quantity: 1 }] }), { idSite: '1' });
    assertThat(r.length).isEqualTo(1);
    assertThat(r[0].params.e_c).isEqualTo('Ecommerce');
- name: cart events send a Matomo cart update with the full cart variable
  code: |-
    const cart = [
      { item_id: 'SKU1', item_name: 'Shoe', price: 10, quantity: 2 },
      { item_id: 'SKU2', item_name: 'Sock', price: 2.5, quantity: 1 }
    ];
    const r = run(ga4Event({ event_name: 'remove_from_cart', items: [{ item_id: 'SKU3' }] }), { idSite: '1', cartItems: cart });
    assertThat(r.length).isEqualTo(2);
    assertThat(r[1].params.idgoal).isEqualTo('0');
    assertThat(r[1].params.revenue).isEqualTo('22.5');
    assertThat(r[1].params.ec_items).isEqualTo('[["SKU1","Shoe","",10,2],["SKU2","Sock","",2.5,1]]');
- name: product views are sent only when enabled
  code: |-
    const ev = ga4Event({ event_name: 'view_item', items: [{ item_id: 'SKU1', item_name: 'Shoe', item_category: 'Shoes', price: 59.95 }] });
    assertThat(run(ev, { idSite: '1' }).length).isEqualTo(1);
    const r = run(ev, { idSite: '1', sendProductViews: true });
    assertThat(r.length).isEqualTo(2);
    assertThat(r[1].params.action_name).isEqualTo('Page');
    assertThat(r[1].params._pks).isEqualTo('SKU1');
    assertThat(r[1].params._pkn).isEqualTo('Shoe');
    assertThat(r[1].params._pkc).isEqualTo('Shoes');
    assertThat(r[1].params._pkp).isEqualTo('59.95');
    assertThat(r[1].params.e_c).isUndefined();
    const list = run(ga4Event({ event_name: 'view_item_list', item_list_name: 'Related' }), { idSite: '1', sendProductViews: true });
    assertThat(list[1].params._pkc).isEqualTo('Related');
- name: goals send an extra hit per matching row
  code: |-
    const goals = [{ eventName: 'generate_lead', goalId: '4', useValue: 'yes' }, { eventName: 'page_view', goalId: '5', useValue: 'no' }];
    const r = run(ga4Event({ event_name: 'generate_lead', value: 50 }), { idSite: '1', goals: goals });
    assertThat(r.length).isEqualTo(2);
    assertThat(r[1].params.idgoal).isEqualTo('4');
    assertThat(r[1].params.revenue).isEqualTo('50');
    assertThat(r[1].params.e_c).isUndefined();
    const pv = run(ga4Event({ event_name: 'page_view', value: 50 }), { idSite: '1', goals: goals });
    assertThat(pv.length).isEqualTo(2);
    assertThat(pv[1].params.idgoal).isEqualTo('5');
    assertThat(pv[1].params.revenue).isUndefined();
setup: |-
  const Object = require('Object');
  const decodeUriComponent = require('decodeUriComponent');
  const sha256Sync = require('sha256Sync');
  const baseData = {
    matomoUrl: 'https://matomo.example.com/',
    tokenAuth: 'tok123',
    idSite: '',
    consentSource: 'auto',
    consentValue: '',
    stripUidOnDenied: true,
    excludedEvents: 'session_start, first_visit, user_engagement',
    eventCategory: '',
    eventAction: '',
    eventName: '',
    eventValue: '',
    searchCategoryKey: '',
    searchCountKey: '',
    goals: [],
    dimensions: [],
    cartItems: '',
    sendProductViews: false,
    overrides: [],
    removeParams: ''
  };
  function withData(extra) {
    const d = {};
    Object.keys(baseData).forEach(function (k) { d[k] = baseData[k]; });
    Object.keys(extra || {}).forEach(function (k) { d[k] = extra[k]; });
    return d;
  }
  function parseBody(body) {
    const params = {};
    body.split('&').forEach(function (pair) {
      const i = pair.indexOf('=');
      params[decodeUriComponent(pair.substring(0, i))] = decodeUriComponent(pair.substring(i + 1));
    });
    return params;
  }
  function run(eventData, extra, status) {
    const requests = [];
    mock('getAllEventData', eventData);
    mock('sendHttpRequest', function (url, cb, options, body) {
      requests.push({ url: url, options: options, body: body, params: parseBody(body) });
      cb(status || 204, {}, '');
    });
    runCode(withData(extra));
    return requests;
  }
  function replayEvent(hitExtra) {
    const hit = { idsite: '1', rec: '1', url: 'https://www.example.com/', _id: '0123456789abcdef' };
    Object.keys(hitExtra).forEach(function (k) { hit[k] = hitExtra[k]; });
    return {
      event_name: 'page_view',
      'x-matomo-hit': hit,
      'x-matomo-idsite': '1',
      ip_override: '203.0.113.9',
      user_agent: 'UA-X',
      language: 'fr-FR'
    };
  }
  function ga4Event(extra) {
    const ev = {
      client_id: '123.456',
      ga_session_id: '789',
      page_location: 'https://www.example.com/p',
      page_title: 'Page',
      page_referrer: 'https://google.com/',
      ip_override: '203.0.113.9',
      user_agent: 'UA-X',
      language: 'fr-fr',
      screen_resolution: '1920x1080'
    };
    Object.keys(extra).forEach(function (k) { ev[k] = extra[k]; });
    return ev;
  }
